quarkus.index-dependency.rimfrost-regel-tests.group-id=se.fk.rimfrost.framework.regel
quarkus.index-dependency.rimfrost-regel-tests.artifact-id=rimfrost-framework-regel
quarkus.index-dependency.rimfrost-regel-tests.classifier=tests

application.config.path=src/test/resources/config-test.yaml
application.storage.storage-directory=testdata

regel.manuell.base-path=/regel/manuell

#OUL Storage

# Disable storage handling since OUL interface is mocked in tests

regel.persistence.table-prefix = regel_manuell
quarkus.flyway.enabled = false
quarkus.hibernate-orm.active=false
quarkus.datasource.devservices.enabled=false

#WireMock

quarkus.wiremock.devservices.enabled=false

#Kafka
kafka.source=RegelManuell
kafka.subtopic=regel-manuell

#Incoming
mp.messaging.incoming.regel-requests.connector=smallrye-in-memory

#Outgoing

# This not actually used by the test, but required by upstream
mp.messaging.outgoing.regel-responses.topic=framework-regel-manuell

mp.messaging.outgoing.regel-responses.connector=smallrye-in-memory


# Kafka off for tests because of in-memory connector
quarkus.kafka.devservices.enabled=false
